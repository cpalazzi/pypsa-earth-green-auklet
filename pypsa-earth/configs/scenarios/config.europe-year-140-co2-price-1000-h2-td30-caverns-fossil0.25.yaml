# Carbon price of 1000 EUR/t (24 Nov 2026): config.europe-year-140-co2-price-sweep-h2-td30-caverns.yaml
# at the one carbon price of 1000 EUR/t,
# with the fuel cost of gas, coal, lignite and oil, and so of grey ammonia, at one-quarter of the
# cost file's prices (opts Fossil0.25, gas at 10 EUR/MWh),
# above the sweep's highest price of 500 EUR/t. Between 500 EUR/t and zero CO2 the ammonia store
# of base+h2+nh3 grows from 5.9 to 30.1 TWh (13 Nov sweep), and with gas at 10 EUR/MWh the first
# estimate puts the carbon price at which ammonia storage matches gas plants at about 610 EUR/t.
# Job 02 deletes only the results matching this config's opts, so the sweep's results stay.
#
# Technology-data runs (6 Oct 2026): PyPSA-Earth default technology-data v0.13.2
# costs, with DEA electrolysis, nuclear at 6504 EUR/kW, updated fuel prices and the
# ammonia components added by build_costs_td.py. Hydrogen tanks have an
# explicit compressor. Discount rate is the PyPSA-Earth default.
#
# Hydrogen salt caverns at nodes with salt, from build_h2_cavern_potentials.py. Technology-data's
# cavern investment and life; fixed OpEx from DEA sheet 151c, 2.13 % of CapEx, as in the green-caribou
# analytical model (technology-data has 0). Flow limited both ways to about 10 % of capacity a day,
# 240 hours (DEA catalogue, chapter 151: "Maximum flowrates in the boreholes govern the filling and
# emptying of the cavern. Maximum withdrawal rates are in the order of 10 % of the storage capacity
# per day").
#
# tartan-tortoise carbon-price sweep (13 Nov 2026): config.europe-year-140-co2-zero-h2-td30-caverns.yaml
# with no CO2 cap and the carbon price, in EUR/t, of the Ep option in each opts value. Job 02
# solves the networks one after another.

version: 0.8.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

results_dir: results/
summary_dir: results/

foresight: overnight

countries:
  - DE
  - FR
  - GB
  - IT
  - ES
  - PL
  - NL
  - BE
  - CZ
  - RO
  - SE
  - PT
  - GR
  - HU
  - AT
  - BG
  - DK
  - FI
  - SK
  - IE
  - HR
  - LT
  - SI
  - LV
  - EE
  - CY
  - LU
  - MT
  - "NO"
  - CH
  - RS
  - BA
  - AL
  - MK
  - ME

enable:
  retrieve_databundle: false
  retrieve_databundle_sector: false
  retrieve_cost_data: false
  download_osm_data: true
  download_global_buildings: false
  build_natura_raster: false
  build_cutout: false
  progress_bar: true
  custom_busmap: false

custom_rules: []

run:
  name: "europe-year-140"
  sector_name: ""
  shared_cutouts: true
  allow_scenario_failure: false

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: [140]
  opts:
  - Co2nocap-Ep1000-3h-H2-TD30-Caverns-Fossil0.25
  planning_horizons:
  - 2030
  sopts:
  - "8760h"
  demand:
  - "AB"

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

co2_budget:
  enable: false
  override_co2opt: true
  co2base_value: co2limit

costs:
  file: "data/costs_td2030.csv"
  emission_prices:
    co2: 60.0  # EUR/tCO2 (2020 EUR) — used only if Ep wildcard has no number

electricity:
  co2limit: 1.0e12
  max_hours:
    H2: 4380
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT, nuclear]
    Store: [battery, H2]
    Link: [CCGT H2, H2 pipeline]
  pipeline_submarine_cost_factor: 2.0
  h2_caverns:
    potentials: data/h2_cavern_potentials_s_140.csv
    fixed_opex: 0.0213
    max_hours: 240

atlite:
  nprocesses: 4
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3

# Malta's 132 kV link from Maghtab Terminal Station, where the Sicily cable lands, to Kappara
# (three circuits in a tunnel), which OSM lacks; without it the rest of Malta is an island
# (DEVELOPMENT_NOTES.md, 19 Nov 2026).
clean_osm_data_options:
  use_custom_cables: "add_custom"
  path_custom_cables: "data/custom_cables.geojson"

# Connect isolated fragments of the OSM network (below 20 % of national load) to the nearest
# backbone bus of the same country. Without this, 27 single-bus islands remained, and four of
# them shed about 3 TWh a year at the 100 EUR/kWh lost-load price. Cyprus stays an island.
cluster_options:
  simplify_network:
    s_threshold_fetch_isolated: 0.2

# European reservoir energy by country (PyPSA-Eur data/hydro_capacities.csv); the global
# table that PyPSA-Earth ships has no European rows, so reservoirs fell back to 6 h.
renewable:
  hydro:
    hydro_capacities_extra: data/hydro_capacities_europe.csv
