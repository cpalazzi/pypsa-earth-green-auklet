# Technology-data runs (6 Oct 2026): PyPSA-Earth default technology-data v0.13.2
# costs, with DEA electrolysis, nuclear at 6504 EUR/kW, updated fuel prices and the
# ammonia components added by build_costs_td2030.py. Hydrogen tanks have an
# explicit compressor. Discount rate is the PyPSA-Earth default.

version: 0.8.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

results_dir: results/
summary_dir: results/

foresight: overnight

countries:
  - DE
  - FR
  - GB
  - IT
  - ES
  - PL
  - NL
  - BE
  - CZ
  - RO
  - SE
  - PT
  - GR
  - HU
  - AT
  - BG
  - DK
  - FI
  - SK
  - IE
  - HR
  - LT
  - SI
  - LV
  - EE
  - CY
  - LU
  - MT
  - "NO"
  - CH
  - RS
  - BA
  - AL
  - MK
  - ME

enable:
  retrieve_databundle: false
  retrieve_databundle_sector: false
  retrieve_cost_data: false
  download_osm_data: true
  download_global_buildings: false
  build_natura_raster: false
  build_cutout: false
  progress_bar: true
  custom_busmap: false

custom_rules: []

run:
  name: "europe-year-140"
  sector_name: ""
  shared_cutouts: true
  allow_scenario_failure: false

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: [140]
  opts: [Co2zero-3h-NH3-TD30-CheapBatt]
  planning_horizons:
  - 2030
  sopts:
  - "8760h"
  demand:
  - "AB"

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

co2_budget:
  enable: false
  override_co2opt: true
  co2base_value: co2limit

costs:
  file: "data/costs_td2030_cheapbatt.csv"

electricity:
  co2limit: 1.0e1
  max_hours:
    H2: 4380
    NH3: 4380
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT, nuclear]
    Store: [battery, H2, NH3]
    Link: [CCGT H2, H2 pipeline, CCGT NH3, NH3 pipeline]
  pipeline_submarine_cost_factor: 2.0

atlite:
  nprocesses: 4
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3

# NH3 pipelines pump liquid ammonia: about 0.1 % of the energy carried per 1000 km
# (DEA energy transport, as in the analytical model).
sector:
  transmission_efficiency:
    NH3 pipeline:
      efficiency_per_1000km: 1
      compression_per_1000km: 0.001
